[package]
name = "accountant-bot"
version = "0.1.0"
edition = "2024"
description = "VK bot for shared cash accounting"
license = "MIT"

[dependencies]
anyhow = "1.0"
bytes = "1.12"
dotenvy = "0.15"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "ttf"] }
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rust_xlsxwriter = { version = "0.102.0", features = ["constant_memory"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
